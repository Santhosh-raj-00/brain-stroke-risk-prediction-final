<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
</head>
<body>
    <h1>API Connection Test</h1>
    <button onclick="testCORS()">Test CORS Endpoint</button>
    <button onclick="testRegister()">Test Registration</button>
    <div id="result"></div>

    <script>
        async function testCORS() {
            try {
                const response = await fetch('http://127.0.0.1:5000/api/test-cors');
                const data = await response.json();
                document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('result').innerHTML = '<p style="color:red;">CORS Test Error: ' + error.message + '</p>';
            }
        }

        async function testRegister() {
            try {
                const response = await fetch('http://127.0.0.1:5000/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'test9@example.com',
                        password: 'password123',
                        full_name: 'Test User',
                        role: 'doctor'
                    })
                });
                
                const data = await response.json();
                document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('result').innerHTML = '<p style="color:red;">Registration Test Error: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
