<!DOCTYPE html>
<html>
<head>
    <title>Simple Connection Test</title>
</head>
<body>
    <h1>Simple Network Test</h1>
    <button onclick="testSimple()">Test Simple HTTP Server (Port 8000)</button>
    <button onclick="testBackend()">Test Backend (Port 5000)</button>
    <div id="result"></div>

    <script>
        async function testSimple() {
            try {
                document.getElementById('result').innerHTML = '<p>Testing http://localhost:8000...</p>';
                const response = await fetch('http://localhost:8000');
                document.getElementById('result').innerHTML = '<p style="color:green;">✓ Simple server accessible! Status: ' + response.status + '</p>';
            } catch (error) {
                document.getElementById('result').innerHTML = '<p style="color:red;">✗ Simple server failed: ' + error.message + '</p>';
            }
        }

        async function testBackend() {
            try {
                document.getElementById('result').innerHTML = '<p>Testing http://localhost:5000/api/test-cors...</p>';
                const response = await fetch('http://localhost:5000/api/test-cors');
                const data = await response.json();
                document.getElementById('result').innerHTML = '<p style="color:green;">✓ Backend accessible! Response: ' + JSON.stringify(data) + '</p>';
            } catch (error) {
                document.getElementById('result').innerHTML = '<p style="color:red;">✗ Backend failed: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
