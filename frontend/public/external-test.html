<!DOCTYPE html>
<html>
<head>
    <title>External Network Test</title>
</head>
<body>
    <h1>External Network Connectivity Test</h1>
    <button onclick="testExternalAPI()">Test External API (JSONPlaceholder)</button>
    <button onclick="testGoogle()">Test Google</button>
    <div id="result"></div>

    <script>
        async function testExternalAPI() {
            try {
                document.getElementById('result').innerHTML = '<p>Testing https://jsonplaceholder.typicode.com/posts/1...</p>';
                const response = await fetch('https://jsonplaceholder.typicode.com/posts/1');
                const data = await response.json();
                document.getElementById('result').innerHTML = '<p style="color:green;">✓ External API accessible! Title: ' + data.title + '</p>';
            } catch (error) {
                document.getElementById('result').innerHTML = '<p style="color:red;">✗ External API failed: ' + error.message + '</p>';
            }
        }

        async function testGoogle() {
            try {
                document.getElementById('result').innerHTML = '<p>Testing https://www.google.com...</p>';
                const response = await fetch('https://www.google.com', { method: 'HEAD' });
                document.getElementById('result').innerHTML = '<p style="color:green;">✓ Google accessible! Status: ' + response.status + '</p>';
            } catch (error) {
                document.getElementById('result').innerHTML = '<p style="color:red;">✗ Google failed: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
